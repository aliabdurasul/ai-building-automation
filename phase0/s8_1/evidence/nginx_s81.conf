
worker_processes 1;
error_log logs/error_s81.log;
pid logs/nginx_s81.pid;
events { worker_connections 64; }
http {
  access_log off;
  include conf/mime.types;
  default_type application/octet-stream;
  upstream fcgi_backend { server 127.0.0.1:30757; keepalive 8; }
  server {
    listen 127.0.0.1:8143;
    root "C:/AI_BMS_POC/master_scada_research/hmi_api_poc/phase0_s81/rt_copy_hmi2/rt_work/Debug_1/htdocs";
    location / {
      try_files $uri $uri/ /index.html;
    }
    location ~ \.fcgi$ {
      fastcgi_pass fcgi_backend;
      include fastcgi_params;
    }
    location /Methods/ {
      fastcgi_pass fcgi_backend;
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
  }
}
